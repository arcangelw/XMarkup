name: XMarkupDemo
options:
  bundleIdPrefix: com.xmarkup.demo
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  XMarkup:
    path: ../../..

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  XMarkupDemoSwiftUI:
    type: application
    platform: iOS
    sources:
      - path: XMarkupDemo/Shared
      - path: XMarkupDemo/SwiftUI
    dependencies:
      - package: XMarkup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "XMarkup Demo"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.xmarkup.demo.swiftui

  XMarkupDemoSwiftUIMac:
    type: application
    platform: macOS
    sources:
      - path: XMarkupDemo/Shared
      - path: XMarkupDemo/SwiftUI
    dependencies:
      - package: XMarkup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "XMarkup Demo"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.xmarkup.demo.swiftui.mac
        CODE_SIGN_IDENTITY: "-"

  XMarkupDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XMarkupDemoTests
    dependencies:
      - target: XMarkupDemoSwiftUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xmarkup.demo.tests
